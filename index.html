<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のんびり農場</title>
<style>
  :root{
    --bg:#eef3e1; --panel:#fffaf0; --ink:#3d3220; --sub:#7a6f57;
    --soil:#8b5a3c; --soil-dark:#6b3f26; --grass:#a8c973; --grass-dark:#8fb85e;
    --accent:#e29b3f; --accent2:#6fa86f; --water:#6ea8d8; --shop:#c97b5f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#20241c; --panel:#2b2a20; --ink:#eee6d3; --sub:#b8ad92;
    }
  }
  :root[data-theme="dark"]{
    --bg:#20241c; --panel:#2b2a20; --ink:#eee6d3; --sub:#b8ad92;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:12px; gap:10px; overflow-x:hidden;
  }
  h1{font-size:1.1rem; margin:4px 0 0; letter-spacing:1px;}
  .sub{color:var(--sub); font-size:0.75rem; margin:0 0 4px;}
  .hud{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); border:2px solid var(--ink); border-radius:10px;
    padding:8px 14px; font-size:0.8rem; max-width:480px; width:100%;
  }
  .hud span{white-space:nowrap;}
  canvas{
    border:3px solid var(--ink); border-radius:8px; background:#4c7a3a;
    max-width:100%; touch-action:none; image-rendering:pixelated;
  }
  .msg{
    min-height:1.4em; font-size:0.85rem; color:var(--accent);
    text-align:center; max-width:480px;
  }
  .controls{
    display:flex; flex-direction:column; gap:8px; align-items:center;
    width:100%; max-width:480px;
  }
  .dpad{
    display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px);
    gap:4px;
  }
  .dpad button{ grid-column:auto; }
  .dpad .up{grid-column:2; grid-row:1;}
  .dpad .left{grid-column:1; grid-row:2;}
  .dpad .down{grid-column:2; grid-row:2;}
  .dpad .right{grid-column:3; grid-row:2;}
  button{
    background:var(--panel); border:2px solid var(--ink); border-radius:8px;
    color:var(--ink); font-family:inherit; font-size:0.85rem;
    padding:10px; cursor:pointer; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap, .hud, .msg, .controls{ touch-action:manipulation; }
  button:active{ background:var(--accent); color:#fff; }
  .actions{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; width:100%;
  }
  .actions button{ font-size:0.78rem; padding:10px 4px; }
  .row2{
    display:flex; gap:6px; width:100%; max-width:480px;
  }
  .row2 button{ flex:1; font-size:0.78rem; }
  .shop{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    display:none; align-items:center; justify-content:center; z-index:10;
    padding:20px;
  }
  .shop.open{ display:flex; }
  .shop-box{
    background:var(--panel); border:3px solid var(--ink); border-radius:12px;
    padding:16px; max-width:340px; width:100%;
  }
  .shop-box h2{ margin-top:0; font-size:1rem; }
  .shop-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px dashed var(--sub); font-size:0.85rem;
  }
  .shop-item button{ padding:5px 10px; font-size:0.75rem; }
  .close-shop{ margin-top:10px; width:100%; }

  .wrap{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:100%; max-width:480px;
  }

  @media (orientation: landscape) and (max-height: 500px){
    body{ padding:8px; gap:6px; justify-content:flex-start; }
    h1{ font-size:0.9rem; margin:0; }
    .sub{ display:none; }
    .wrap{
      flex-direction:row; align-items:flex-start; justify-content:center;
      max-width:100%; gap:14px;
    }
    .left-col{ display:flex; flex-direction:column; gap:6px; align-items:center; }
    .hud{ font-size:0.7rem; padding:6px 10px; max-width:340px; }
    canvas{ max-height:78vh; width:auto; }
    .right-col{
      display:flex; flex-direction:column; gap:6px; width:190px;
    }
    .msg{ font-size:0.75rem; max-width:190px; }
    .actions{ grid-template-columns:1fr 1fr; }
    .actions button{ padding:7px 4px; font-size:0.7rem; }
    .row2 button{ padding:7px 4px; font-size:0.7rem; }
    .dpad{
      grid-template-columns:repeat(3,38px); grid-template-rows:repeat(3,38px);
    }
  }
</style>
</head>
<body>
  <h1>🌾 のんびり農場</h1>
  <p class="sub">矢印/WASDで移動・タップ操作対応</p>

  <div class="wrap">
    <div class="left-col">
      <div class="hud">
        <span>💰 <b id="gold">50</b> G</span>
        <span>📅 <b id="day">1</b> 日目</span>
        <span>⚡ <b id="stamina">10</b>/10</span>
        <span>🎒 種 <b id="seeds">3</b></span>
      </div>
      <canvas id="game" width="360" height="280"></canvas>
    </div>
    <div class="right-col">
      <div class="msg" id="msg">畑で W を押すと耕せるよ</div>
      <div class="controls">
        <div class="actions">
          <button id="btnTill">🪓 耕す</button>
          <button id="btnPlant">🌱 植える</button>
          <button id="btnWater">💧 水やり</button>
          <button id="btnHarvest">🧺 収穫</button>
        </div>
        <div class="row2">
          <button id="btnShop">🏪 お店</button>
          <button id="btnSleep">🌙 寝る(翌日へ)</button>
        </div>
        <div class="dpad">
          <button class="up" data-dir="up">↑</button>
          <button class="left" data-dir="left">←</button>
          <button class="down" data-dir="down">↓</button>
          <button class="right" data-dir="right">→</button>
        </div>
      </div>
    </div>
  </div>

  <div class="shop" id="shopModal">
    <div class="shop-box">
      <h2>🏪 種屋さん</h2>
      <div class="shop-item">
        <span>かぶの種 (5G)</span>
        <button id="buySeed">買う</button>
      </div>
      <div class="shop-item">
        <span>収穫物を売る (1個 10G)</span>
        <button id="sellCrop">売る</button>
      </div>
      <p class="sub" id="shopInfo" style="margin-top:8px;"></p>
      <button class="close-shop" id="closeShop">閉じる</button>
    </div>
  </div>

<script>
(function(){
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 350){ e.preventDefault(); }
    lastTouchEnd = now;
  }, { passive:false });

  const TILE = 36, COLS = 10, ROWS = 7;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = TILE*COLS; canvas.height = TILE*ROWS;

  const SAVE_KEY = 'nonbiri-farm-save-v1';

  // Map layout: 0 grass, 1 soil(farmable), 2 shop, 3 path
  const layout = [
    "0000030000",
    "0111130000",
    "0111130000",
    "0111130220",
    "0111130000",
    "0000030000",
    "0000000000",
  ];

  let state = {
    x:4, y:3, dir:'down',
    gold:50, day:1, stamina:10, seeds:3, harvested:0,
    tiles:{} // "x,y" -> {tilled, planted, growth, watered}
  };

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw){ const parsed = JSON.parse(raw); state = Object.assign(state, parsed); }
    }catch(e){ console.warn('load failed', e); }
  }
  function save(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn('save failed', e); }
  }

  function tileAt(x,y){ return layout[y] ? layout[y][x] : '0'; }
  function key(x,y){ return x+','+y; }
  function farmTile(x,y){
    const k = key(x,y);
    if(!state.tiles[k]) state.tiles[k] = {tilled:false, planted:false, growth:0, watered:false};
    return state.tiles[k];
  }

  function setMsg(t){ document.getElementById('msg').textContent = t; }
  function updateHud(){
    document.getElementById('gold').textContent = state.gold;
    document.getElementById('day').textContent = state.day;
    document.getElementById('stamina').textContent = state.stamina;
    document.getElementById('seeds').textContent = state.seeds;
  }

  function move(dx,dy,dir){
    state.dir = dir;
    const nx = state.x+dx, ny = state.y+dy;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS) return;
    if(tileAt(nx,ny)==='2'){ return; } // shop blocks movement, open via button near it
    state.x = nx; state.y = ny;
    draw(); save();
  }

  function nearShop(){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(tileAt(state.x+dx, state.y+dy)==='2') return true;
    }
    return false;
  }

  function useStamina(n){
    if(state.stamina < n){ setMsg('スタミナが足りないよ…寝て回復しよう'); return false; }
    state.stamina -= n;
    return true;
  }

  function till(){
    if(tileAt(state.x,state.y) !== '1'){ setMsg('ここは畑じゃないよ'); return; }
    const t = farmTile(state.x,state.y);
    if(t.tilled){ setMsg('もう耕してあるよ'); return; }
    if(!useStamina(1)) return;
    t.tilled = true;
    setMsg('土を耕したよ🪓');
    updateHud(); draw(); save();
  }

  function plant(){
    if(tileAt(state.x,state.y) !== '1'){ setMsg('ここは畑じゃないよ'); return; }
    const t = farmTile(state.x,state.y);
    if(!t.tilled){ setMsg('先に耕さないと'); return; }
    if(t.planted){ setMsg('もう植えてあるよ'); return; }
    if(state.seeds<=0){ setMsg('種がないよ。お店で買おう'); return; }
    if(!useStamina(1)) return;
    t.planted = true; t.growth = 0; t.watered = false;
    state.seeds--;
    setMsg('種を植えたよ🌱');
    updateHud(); draw(); save();
  }

  function water(){
    if(tileAt(state.x,state.y) !== '1'){ setMsg('ここは畑じゃないよ'); return; }
    const t = farmTile(state.x,state.y);
    if(!t.planted){ setMsg('何も植えてないよ'); return; }
    if(t.watered){ setMsg('今日はもう水やりしたよ'); return; }
    if(!useStamina(1)) return;
    t.watered = true;
    setMsg('水をあげたよ💧');
    updateHud(); draw(); save();
  }

  function harvest(){
    if(tileAt(state.x,state.y) !== '1'){ setMsg('ここは畑じゃないよ'); return; }
    const t = farmTile(state.x,state.y);
    if(!t.planted || t.growth < 3){ setMsg('まだ収穫できないよ'); return; }
    state.harvested++;
    t.planted = false; t.tilled = false; t.growth = 0; t.watered = false;
    setMsg('収穫した!🧺 お店で売れるよ');
    updateHud(); draw(); save();
  }

  function sleep(){
    // grow watered crops
    Object.values(state.tiles).forEach(t=>{
      if(t.planted && t.watered && t.growth<3){ t.growth++; }
      t.watered = false;
    });
    state.day++;
    state.stamina = 10;
    setMsg('おやすみ…🌙 また新しい一日だよ');
    updateHud(); draw(); save();
  }

  function openShop(){
    if(!nearShop()){ setMsg('お店の近くまで行こう🏪'); return; }
    document.getElementById('shopModal').classList.add('open');
    document.getElementById('shopInfo').textContent = `収穫物ストック: ${state.harvested}個`;
  }
  function closeShop(){ document.getElementById('shopModal').classList.remove('open'); }

  document.getElementById('buySeed').onclick = ()=>{
    if(state.gold<5){ setMsg('お金が足りないよ'); return; }
    state.gold -= 5; state.seeds++;
    updateHud();
    document.getElementById('shopInfo').textContent = `種を買ったよ🌱 残り収穫物: ${state.harvested}個`;
    save();
  };
  document.getElementById('sellCrop').onclick = ()=>{
    if(state.harvested<=0){ setMsg('売れる収穫物がないよ'); return; }
    state.harvested--; state.gold += 10;
    updateHud();
    document.getElementById('shopInfo').textContent = `売れたよ!収穫物: ${state.harvested}個`;
    save();
  };
  document.getElementById('closeShop').onclick = closeShop;
  document.getElementById('btnShop').onclick = openShop;
  document.getElementById('btnSleep').onclick = sleep;
  document.getElementById('btnTill').onclick = till;
  document.getElementById('btnPlant').onclick = plant;
  document.getElementById('btnWater').onclick = water;
  document.getElementById('btnHarvest').onclick = harvest;

  document.querySelectorAll('.dpad button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const d = b.dataset.dir;
      if(d==='up') move(0,-1,'up');
      if(d==='down') move(0,1,'down');
      if(d==='left') move(-1,0,'left');
      if(d==='right') move(1,0,'right');
    });
  });

  window.addEventListener('keydown', (e)=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': move(0,-1,'up'); break;
      case 'ArrowDown': case 's': case 'S': move(0,1,'down'); break;
      case 'ArrowLeft': case 'a': case 'A': move(-1,0,'left'); break;
      case 'ArrowRight': case 'd': case 'D': move(1,0,'right'); break;
      case '1': till(); break;
      case '2': plant(); break;
      case '3': water(); break;
      case '4': harvest(); break;
      case 'e': case 'E': openShop(); break;
    }
  });

  function drawTile(x,y){
    const t = tileAt(x,y);
    const px = x*TILE, py = y*TILE;
    if(t==='0'){
      ctx.fillStyle = (x+y)%2===0 ? '#a8c973' : '#9fc26a';
      ctx.fillRect(px,py,TILE,TILE);
    } else if(t==='3'){
      ctx.fillStyle = '#d9c48a';
      ctx.fillRect(px,py,TILE,TILE);
    } else if(t==='2'){
      ctx.fillStyle = '#c97b5f';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle = '#7a4632';
      ctx.fillRect(px+4,py+TILE-14,TILE-8,14);
      ctx.fillStyle = '#fff8ec';
      ctx.font = '9px monospace';
      ctx.fillText('店', px+TILE/2-5, py+TILE/2+3);
    } else if(t==='1'){
      const ft = farmTile(x,y);
      ctx.fillStyle = ft.tilled ? '#6b3f26' : '#8b5a3c';
      ctx.fillRect(px,py,TILE,TILE);
      // furrows
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      for(let i=6;i<TILE;i+=8){ ctx.beginPath(); ctx.moveTo(px+i,py); ctx.lineTo(px+i,py+TILE); ctx.stroke(); }
      if(ft.planted){
        const g = ft.growth;
        ctx.fillStyle = g>=3 ? '#e8b13a' : '#5fa85f';
        const h = 6 + g*6;
        ctx.fillRect(px+TILE/2-3, py+TILE-h, 6, h);
        if(g>=3){
          ctx.fillStyle = '#f4d06a';
          ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE-h-4, 5, 0, Math.PI*2); ctx.fill();
        }
      }
      if(ft.watered){
        ctx.fillStyle = 'rgba(110,168,216,0.35)';
        ctx.fillRect(px,py,TILE,TILE);
      }
    }
  }

  function drawPlayer(){
    const px = state.x*TILE, py = state.y*TILE;
    ctx.fillStyle = '#f2c14e';
    ctx.beginPath(); ctx.arc(px+TILE/2, py+TILE/2-4, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5b3a29';
    ctx.fillRect(px+TILE/2-8, py+TILE/2+2, 16, 14);
    // direction indicator
    ctx.fillStyle = '#3d3220';
    let ix=px+TILE/2, iy=py+TILE/2-4;
    if(state.dir==='up') iy-=10;
    if(state.dir==='down') iy+=10;
    if(state.dir==='left') ix-=10;
    if(state.dir==='right') ix+=10;
    ctx.fillRect(ix-2,iy-2,4,4);
  }

  function draw(){
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) drawTile(x,y);
    drawPlayer();
  }

  load();
  updateHud();
  draw();
})();
</script>
</body>
</html>
