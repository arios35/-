<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のんびり農場</title>
<style>
  :root{
    --bg:#eef3e1; --panel:#fffaf0; --ink:#3d3220; --sub:#7a6f57;
    --soil:#8b5a3c; --soil-dark:#6b3f26; --grass:#a8c973; --grass-dark:#8fb85e;
    --accent:#e29b3f; --accent2:#6fa86f; --water:#6ea8d8; --shop:#c97b5f;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#20241c; --panel:#2b2a20; --ink:#eee6d3; --sub:#b8ad92;
    }
  }
  :root[data-theme="dark"]{
    --bg:#20241c; --panel:#2b2a20; --ink:#eee6d3; --sub:#b8ad92;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:12px; gap:10px; overflow-x:hidden;
  }
  h1{font-size:1.1rem; margin:4px 0 0; letter-spacing:1px;}
  .sub{color:var(--sub); font-size:0.75rem; margin:0 0 4px;}
  .hud{
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    background:var(--panel); border:2px solid var(--ink); border-radius:10px;
    padding:8px 14px; font-size:0.8rem; max-width:480px; width:100%;
  }
  .hud span{white-space:nowrap;}
  canvas{
    border:3px solid var(--ink); border-radius:8px; background:#4c7a3a;
    max-width:100%; touch-action:manipulation;
  }
  .msg{
    min-height:1.4em; font-size:0.85rem; color:var(--accent);
    text-align:center; max-width:480px;
  }
  .controls{
    display:flex; flex-direction:column; gap:8px; align-items:center;
    width:100%; max-width:480px;
  }
  .joystick{
    width:150px; height:150px; border-radius:50%;
    background:var(--panel); border:3px solid var(--ink);
    position:relative; touch-action:none; margin:6px 0;
  }
  .joystick-knob{
    width:60px; height:60px; border-radius:50%;
    background:var(--accent2); border:2px solid var(--ink);
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  button{
    background:var(--panel); border:2px solid var(--ink); border-radius:10px;
    color:var(--ink); font-family:inherit; font-size:0.85rem;
    padding:10px; cursor:pointer; user-select:none; -webkit-user-select:none;
    touch-action:manipulation;
  }
  .wrap, .hud, .msg, .controls{ touch-action:manipulation; }
  button:active{ background:var(--accent); color:#fff; }
  .big-row{
    display:flex; gap:8px; width:100%;
  }
  .big-btn{
    flex:1; font-size:1rem; padding:16px 8px; font-weight:bold; border-radius:12px;
  }
  #btnAction{ background:var(--accent2); color:#fff; border-color:var(--accent2); }
  #btnSleep{ background:#5b6fa8; color:#fff; border-color:#5b6fa8; }
  .shop{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    display:none; align-items:center; justify-content:center; z-index:10;
    padding:20px;
  }
  .shop.open{ display:flex; }
  .shop-box{
    background:var(--panel); border:3px solid var(--ink); border-radius:12px;
    padding:16px; max-width:340px; width:100%;
  }
  .shop-box h2{ margin-top:0; font-size:1rem; }
  .shop-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 0; border-bottom:1px dashed var(--sub); font-size:0.85rem;
  }
  .shop-item button{ padding:5px 10px; font-size:0.75rem; }
  .close-shop{ margin-top:10px; width:100%; }

  .wrap{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    width:100%; max-width:480px;
  }

  @media (orientation: landscape) and (max-height: 500px){
    body{ padding:8px; gap:6px; justify-content:flex-start; }
    h1{ font-size:0.9rem; margin:0; }
    .sub{ display:none; }
    .wrap{
      flex-direction:row; align-items:flex-start; justify-content:center;
      max-width:100%; gap:14px;
    }
    .left-col{ display:flex; flex-direction:column; gap:6px; align-items:center; }
    .hud{ font-size:0.7rem; padding:6px 10px; max-width:340px; }
    canvas{ max-height:78vh; width:auto; }
    .right-col{
      display:flex; flex-direction:column; gap:6px; width:190px;
    }
    .msg{ font-size:0.75rem; max-width:190px; }
    .big-btn{ padding:12px 6px; font-size:0.85rem; }
    .joystick{ width:110px; height:110px; }
    .joystick-knob{ width:44px; height:44px; }
  }
</style>
</head>
<body>
  <h1>🌾 のんびり農場</h1>
  <p class="sub">矢印/WASDで移動・アクションボタンで畑仕事/会話/お世話</p>

  <div class="wrap">
    <div class="left-col">
      <div class="hud">
        <span>💰 <b id="gold">50</b> G</span>
        <span>📅 <b id="day">1</b> 日目</span>
        <span>⚡ <b id="stamina">10</b>/10</span>
        <span>🎒 <b id="seeds">3</b></span>
        <span>🥚 <b id="eggs">0</b></span>
      </div>
      <canvas id="game" width="360" height="280"></canvas>
    </div>
    <div class="right-col">
      <div class="msg" id="msg">畑まで歩いて「アクション」を押してみて</div>
      <div class="controls">
        <div class="joystick" id="joystick">
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="big-row">
          <button class="big-btn" id="btnAction">⚡ アクション</button>
        </div>
        <div class="big-row">
          <button class="big-btn" id="btnSleep">🌙 寝る(翌日へ)</button>
        </div>
      </div>
    </div>
  </div>

  <div class="shop" id="shopModal">
    <div class="shop-box">
      <h2>🏪 種屋さん</h2>
      <div class="shop-item">
        <span>かぶの種 (5G)</span>
        <button id="buySeed">買う</button>
      </div>
      <div class="shop-item">
        <span>収穫物を売る (1個 10G)</span>
        <button id="sellCrop">売る</button>
      </div>
      <div class="shop-item">
        <span>卵を売る (1個 15G)</span>
        <button id="sellEgg">売る</button>
      </div>
      <p class="sub" id="shopInfo" style="margin-top:8px;"></p>
      <button class="close-shop" id="closeShop">閉じる</button>
    </div>
  </div>

<script>
(function(){
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 350){ e.preventDefault(); }
    lastTouchEnd = now;
  }, { passive:false });

  const TILE = 30, VIEW_COLS = 14, VIEW_ROWS = 10;
  const COLS = 32, ROWS = 24; // world size (bigger than the visible viewport)
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 3);
  const displayW = TILE*VIEW_COLS, displayH = TILE*VIEW_ROWS;
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  canvas.width = displayW * DPR;
  canvas.height = displayH * DPR;
  ctx.scale(DPR, DPR);

  const SAVE_KEY = 'nonbiri-farm-save-v1';

  // World: 0 grass, 1 soil, 2 shop, 3 path, 4 NPC, 5 chicken coop, 6 tree, 7 water
  const layout = [];
  for(let y=0;y<ROWS;y++){ const row=[]; for(let x=0;x<COLS;x++) row.push('0'); layout.push(row); }
  function fillRect(x0,y0,x1,y1,ch){
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ if(layout[y] && layout[y][x]!==undefined) layout[y][x]=ch; }
  }
  fillRect(4,3,10,8,'1');            // home farm
  fillRect(3,2,11,2,'8');            // farm fence: north
  fillRect(3,9,11,9,'8');            // farm fence: south
  fillRect(3,3,3,8,'8');             // farm fence: west
  fillRect(11,2,11,18,'3');          // main path spine (reopens east side of farm)
  fillRect(11,6,18,6,'3');           // branch to village
  fillRect(18,6,18,16,'3');          // branch down
  fillRect(18,16,24,16,'3');         // branch to second farm
  fillRect(21,17,26,20,'1');         // second farm plot
  fillRect(2,14,6,17,'7');           // lake
  layout[4][15]='a'; layout[4][16]='b'; layout[4][17]='c'; // shop building: roof (3 tiles)
  layout[5][15]='d'; layout[5][16]='e'; layout[5][17]='f'; // shop building: walls + door (3 tiles)
  layout[4][13]='4';                 // NPC
  layout[8][16]='5';                 // chicken coop
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(layout[y][x]==='0' && (x*7+y*13)%23===0) layout[y][x]='6'; // scattered trees
  }

  const SOLID = new Set(['2','4','5','6','7','8','a','b','c','d','e','f']);

  let state = {
    px:6, py:5, dir:'down',
    gold:50, day:1, stamina:10, seeds:3, harvested:0, eggs:0,
    chicken:{ fed:false, eggReady:false },
    tiles:{} // "x,y" -> {tilled, planted, growth, watered}
  };

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = Object.assign(state, parsed);
        if(state.px===undefined && parsed.x!==undefined){ state.px = parsed.x; state.py = parsed.y; }
      }
    }catch(e){ console.warn('load failed', e); }
  }
  function save(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn('save failed', e); }
  }

  // 16x16 pixel-art humanoid sprite (chibi villager), reused for player & NPCs
  const PERSON_SPRITE = [
    "................",
    "......HHHH......",
    ".....HHHHHH.....",
    ".....HSSSSH.....",
    ".....HSSSSH.....",
    ".....SSEESS.....",
    "......SSSS......",
    ".......SS.......",
    "......BBBB......",
    ".....BBBBBB.....",
    ".....BBBBBB.....",
    ".....BB..BB.....",
    "......BBBB......",
    "......PPPP......",
    ".....PP..PP.....",
    ".....OO..OO.....",
  ];
  // Back-facing (up): hide the eyes so it reads as the back of the head
  const BACK_SPRITE = [
    "................",
    "......HHHH......",
    ".....HHHHHH.....",
    ".....HHHHHH.....",
    ".....HHHHHH.....",
    ".....HHHHHH.....",
    "......SSSS......",
    ".......SS.......",
    "......BBBB......",
    ".....BBBBBB.....",
    ".....BBBBBB.....",
    ".....BB..BB.....",
    "......BBBB......",
    "......PPPP......",
    ".....PP..PP.....",
    ".....OO..OO.....",
  ];
  // Side-facing (right; mirrored for left): single visible eye, arm forward
  const SIDE_SPRITE = [
    "................",
    ".......HHHH.....",
    "......HHHHHH....",
    "......HSSSSH....",
    "......HSSSSH....",
    ".......SSES.....",
    "......SSSSS.....",
    ".......SSS......",
    ".....BBBBB......",
    "....BBBBBBB.....",
    "....BBBBBBBB....",
    "....BB...BB.....",
    ".....BBBBB......",
    ".....PPPP.......",
    "....PP..PP......",
    "....OO..OO......",
  ];
  // Wheat growth-stage sprites: mature stage uses 2x2 (4-block) grain heads
  const SPROUT_SPRITE = [
    "................","................","................","................",
    "................","................","................","................",
    "................","................","................","................",
    "................","......GG........",".......G........",".......G........",
  ];
  const GROWING_SPRITE = [
    "................","................","................","................",
    "................","................","................","................",
    "......G..G......","......G..G......","......G..G......","......G..G......",
    "......G..G......","......G..G......","......G..G......","......G..G......",
  ];
  const MATURE_SPRITE = [
    "................","................",".....WW..WW.....",".....WW..WW.....",
    "......G..G......","......G..G......","......G..G......","......G..G......",
    "......G..G......","......G..G......","......G..G......","......G..G......",
    "......G..G......","......G..G......","......G..G......","......G..G......",
  ];
  const WHEAT_PALETTE = { G:'#5fa85f', W:'#f0c14e' };
  const WHEAT_RIPE_PALETTE = { G:'#8a9b3f', W:'#f4d06a' };

  // Detailed tree sprite (layered canopy over a trunk)
  const TREE_SPRITE = [
    "................",
    "......LLLL......",
    ".....LLLLLL.....",
    "....LALLLLAL....",
    "...LLLLLLLLLL...",
    "....LLALLALL....",
    ".....LLLLLL.....",
    "......LLLL......",
    ".......TT.......",
    ".......TT.......",
    ".......TT.......",
    ".......TT.......",
    "......TTTT......",
    "................",
    "................",
    "................",
  ];
  const TREE_PALETTE = { L:'#4a8f4a', T:'#6b4a2a', A:'#e08030' };

  // Detailed house/shop sprite (roof, windows, door)
  const HOUSE_SPRITE = [
    "................",
    ".......RR.......",
    "......RRRR......",
    ".....RRRRRR.....",
    "....RRRRRRRR....",
    "...RRRRRRRRRR...",
    "..RRRRRRRRRRRR..",
    "..FFFFFFFFFFFF..",
    "..FKKFFFFKKFFF..",
    "..FKKFFFFKKFFF..",
    "..FFFFFFFFFFFF..",
    "..FFFFFDDFFFFF..",
    "..FFFFFDDFFFFF..",
    "..FFFFFFFFFFFF..",
    "................",
    "................",
  ];
  const HOUSE_PALETTE = { R:'#a5503a', F:'#e8dcb8', K:'#6ea8d8', D:'#6b3f26' };
  function drawSprite(px, py, sprite, palette, scale, flip){
    ctx.save();
    if(flip){ ctx.translate(px + sprite[0].length*scale, py); ctx.scale(-1,1); px = 0; py = 0; }
    for(let ry=0; ry<sprite.length; ry++){
      const row = sprite[ry];
      for(let rx=0; rx<row.length; rx++){
        const c = row[rx];
        if(c==='.') continue;
        ctx.fillStyle = palette[c];
        ctx.fillRect(px + rx*scale, py + ry*scale, scale, scale);
      }
    }
    ctx.restore();
  }
  const PLAYER_PALETTE = { H:'#5b3a29', S:'#f2c58a', E:'#2a2118', B:'#e29b3f', P:'#4a3a2a', O:'#2a2118' };
  const NPC_PALETTE    = { H:'#8a4a3a', S:'#f2c58a', E:'#2a2118', B:'#6fa86f', P:'#4a3a2a', O:'#2a2118' };
  function tileAt(x,y){ return layout[y] ? layout[y][x] : '0'; }
  function tileX(){ return Math.round(state.px); }
  function tileY(){ return Math.round(state.py); }
  function key(x,y){ return x+','+y; }
  function farmTile(x,y){
    const k = key(x,y);
    if(!state.tiles[k]) state.tiles[k] = {tilled:false, planted:false, growth:0, watered:false};
    return state.tiles[k];
  }

  function setMsg(t){ document.getElementById('msg').textContent = t; }
  function updateHud(){
    document.getElementById('gold').textContent = state.gold;
    document.getElementById('day').textContent = state.day;
    document.getElementById('stamina').textContent = state.stamina;
    document.getElementById('seeds').textContent = state.seeds;
    document.getElementById('eggs').textContent = state.eggs;
  }

  function collides(px, py){
    const m = 0.16; // inset so the hitbox is a bit smaller than a full tile
    const pts = [[px+m,py+m],[px+1-m,py+m],[px+m,py+1-m],[px+1-m,py+1-m]];
    for(const [cx,cy] of pts){
      const t = tileAt(Math.floor(cx), Math.floor(cy));
      if(SOLID.has(t)) return true;
      if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return true;
    }
    return false;
  }

  const SPEED = 4.2; // tiles per second
  function updatePosition(dt, vx, vy){
    if(vx===0 && vy===0) return;
    const len = Math.hypot(vx,vy) || 1;
    vx /= len; vy /= len;
    const nx = state.px + vx*SPEED*dt;
    if(!collides(nx, state.py)) state.px = nx;
    const ny = state.py + vy*SPEED*dt;
    if(!collides(state.px, ny)) state.py = ny;
    if(Math.abs(vx) > Math.abs(vy)) state.dir = vx>0 ? 'right' : 'left';
    else state.dir = vy>0 ? 'down' : 'up';
  }

  const SHOP_CHARS = new Set(['a','b','c','d','e','f']);
  function nearAny(chars){
    const tx = tileX(), ty = tileY();
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(chars.has(tileAt(tx+dx, ty+dy))) return true;
    }
    return false;
  }
  function nearType(type){ return nearAny(new Set([type])); }

  function useStamina(n){
    if(state.stamina < n){ setMsg('スタミナが足りないよ…寝て回復しよう'); return false; }
    state.stamina -= n;
    return true;
  }

  function action(){
    const cur = tileAt(tileX(), tileY());
    if(cur==='1'){ farmAction(); return; }
    if(nearAny(SHOP_CHARS)){ openShop(); return; }
    if(nearType('4')){ talkNPC(); return; }
    if(nearType('5')){ chickenAction(); return; }
    setMsg('ここでは何もできないみたい');
  }

  function farmAction(){
    const t = farmTile(tileX(), tileY());
    if(!t.tilled){
      if(!useStamina(1)) return;
      t.tilled = true;
      setMsg('土を耕したよ🪓');
    } else if(!t.planted){
      if(state.seeds<=0){ setMsg('種がないよ。お店で買おう🏪'); return; }
      if(!useStamina(1)) return;
      t.planted = true; t.growth = 0; t.watered = false;
      state.seeds--;
      setMsg('種を植えたよ🌱');
    } else if(t.growth>=3){
      state.harvested++;
      t.planted = false; t.tilled = false; t.growth = 0; t.watered = false;
      setMsg('収穫した!🧺 お店で売れるよ');
    } else if(!t.watered){
      if(!useStamina(1)) return;
      t.watered = true;
      setMsg('水をあげたよ💧');
    } else {
      setMsg('今日はもうやることないよ。育つまで待とう');
    }
    updateHud(); draw(); save();
  }

  const npcLines = [
    '今日もいい天気だね〜',
    '畑仕事は順調?',
    'お店で種を買えるよ🏪',
    'たまには休むのも大事だよ',
    'この村、のんびりしてていいでしょ',
    'ニワトリにもエサあげてる?',
    '雨の日は水やりしなくても育つらしいよ'
  ];
  function talkNPC(){
    setMsg('👩 ' + npcLines[Math.floor(Math.random()*npcLines.length)]);
  }

  function chickenAction(){
    if(state.chicken.eggReady){
      state.eggs++;
      state.chicken.eggReady = false;
      setMsg('卵を集めたよ🥚');
      updateHud(); save(); return;
    }
    if(state.chicken.fed){
      setMsg('もうエサはあげたよ'); return;
    }
    if(!useStamina(1)) return;
    state.chicken.fed = true;
    setMsg('ニワトリにエサをあげたよ🐔');
    updateHud(); save();
  }

  function sleep(){
    const isRain = Math.random() < 0.3;
    Object.values(state.tiles).forEach(t=>{
      if(t.planted && (t.watered || isRain) && t.growth<3){ t.growth++; }
      t.watered = false;
    });
    if(state.chicken.fed){ state.chicken.eggReady = true; }
    state.chicken.fed = false;
    state.day++;
    state.stamina = 10;
    setMsg(isRain ? '雨の音…🌧️ 畑は自動で水やりされたよ' : 'おやすみ…🌙 また新しい一日だよ');
    updateHud(); draw(); save();
  }

  function openShop(){
    document.getElementById('shopModal').classList.add('open');
    document.getElementById('shopInfo').textContent = `収穫物: ${state.harvested}個 / 卵: ${state.eggs}個`;
  }
  function closeShop(){ document.getElementById('shopModal').classList.remove('open'); }

  document.getElementById('buySeed').onclick = ()=>{
    if(state.gold<5){ setMsg('お金が足りないよ'); return; }
    state.gold -= 5; state.seeds++;
    updateHud();
    document.getElementById('shopInfo').textContent = `種を買ったよ🌱 収穫物: ${state.harvested}個 / 卵: ${state.eggs}個`;
    save();
  };
  document.getElementById('sellCrop').onclick = ()=>{
    if(state.harvested<=0){ setMsg('売れる収穫物がないよ'); return; }
    state.harvested--; state.gold += 10;
    updateHud();
    document.getElementById('shopInfo').textContent = `売れたよ!収穫物: ${state.harvested}個 / 卵: ${state.eggs}個`;
    save();
  };
  document.getElementById('sellEgg').onclick = ()=>{
    if(state.eggs<=0){ setMsg('売れる卵がないよ'); return; }
    state.eggs--; state.gold += 15;
    updateHud();
    document.getElementById('shopInfo').textContent = `卵が売れたよ🥚 収穫物: ${state.harvested}個 / 卵: ${state.eggs}個`;
    save();
  };
  document.getElementById('closeShop').onclick = closeShop;
  document.getElementById('btnSleep').onclick = sleep;
  document.getElementById('btnAction').onclick = action;

  // Virtual joystick: drag the knob to steer freely, analog-style
  const inputVec = { x:0, y:0 };
  const stickVec = { x:0, y:0 };
  const keyVec = { up:false, down:false, left:false, right:false };
  (function setupJoystick(){
    const stick = document.getElementById('joystick');
    const knob = document.getElementById('joystickKnob');
    const RADIUS = 50, DEADZONE = 10;
    let dragging = false, center = {x:0,y:0};

    function onDown(e){
      dragging = true;
      const r = stick.getBoundingClientRect();
      center = { x:r.left + r.width/2, y:r.top + r.height/2 };
      stick.setPointerCapture && e.pointerId!=null && stick.setPointerCapture(e.pointerId);
      onMove(e);
    }
    function onMove(e){
      if(!dragging) return;
      const dx = e.clientX - center.x, dy = e.clientY - center.y;
      const dist = Math.hypot(dx,dy);
      const clamped = Math.min(dist, RADIUS);
      const ang = Math.atan2(dy,dx);
      const kx = Math.cos(ang)*clamped, ky = Math.sin(ang)*clamped;
      knob.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
      if(dist < DEADZONE){ stickVec.x = 0; stickVec.y = 0; }
      else{ stickVec.x = (kx/RADIUS); stickVec.y = (ky/RADIUS); }
    }
    function onUp(){
      dragging = false; stickVec.x = 0; stickVec.y = 0;
      knob.style.transform = 'translate(-50%,-50%)';
    }
    stick.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  })();

  window.addEventListener('keydown', (e)=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': keyVec.up=true; break;
      case 'ArrowDown': case 's': case 'S': keyVec.down=true; break;
      case 'ArrowLeft': case 'a': case 'A': keyVec.left=true; break;
      case 'ArrowRight': case 'd': case 'D': keyVec.right=true; break;
      case ' ': case 'Enter': case 'e': case 'E': action(); break;
    }
  });
  window.addEventListener('keyup', (e)=>{
    switch(e.key){
      case 'ArrowUp': case 'w': case 'W': keyVec.up=false; break;
      case 'ArrowDown': case 's': case 'S': keyVec.down=false; break;
      case 'ArrowLeft': case 'a': case 'A': keyVec.left=false; break;
      case 'ArrowRight': case 'd': case 'D': keyVec.right=false; break;
    }
  });

  function camera(){
    const camX = Math.max(0, Math.min(COLS-VIEW_COLS, state.px + 0.5 - VIEW_COLS/2));
    const camY = Math.max(0, Math.min(ROWS-VIEW_ROWS, state.py + 0.5 - VIEW_ROWS/2));
    return {camX, camY};
  }

  function drawTile(wx, wy, sx, sy){
    const t = tileAt(wx,wy);
    const px = sx*TILE, py = sy*TILE;
    if(t==='0'){
      ctx.fillStyle = (wx+wy)%2===0 ? '#a8c973' : '#9fc26a';
      ctx.fillRect(px,py,TILE,TILE);
    } else if(t==='3'){
      ctx.fillStyle = '#e8dcae';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle = 'rgba(0,0,0,0.07)';
      ctx.fillRect(px+3,py+3,TILE-6,TILE-6);
    } else if(t==='8'){
      ctx.fillStyle = '#a8c973';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle = '#8a4a32';
      ctx.fillRect(px+3,py+TILE/2-7,TILE-6,6);
      ctx.fillStyle = '#c97b5f';
      ctx.fillRect(px+TILE/2-3,py+4,6,TILE-8);
    } else if(t==='6'){
      ctx.fillStyle = '#a8c973';
      ctx.fillRect(px,py,TILE,TILE);
      drawSprite(px, py, TREE_SPRITE, TREE_PALETTE, TILE/16, false);
    } else if(t==='7'){
      ctx.fillStyle = '#6ea8d8';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(px+4,py+TILE/2); ctx.lineTo(px+TILE-4,py+TILE/2); ctx.stroke();
    } else if(t==='a'||t==='b'||t==='c'){
      ctx.fillStyle = '#2d3548';
      ctx.fillRect(px,py,TILE,TILE);
      if(t==='b'){ ctx.fillStyle = '#465577'; ctx.fillRect(px+2,py+3,TILE-4,3); }
    } else if(t==='d'||t==='e'||t==='f'){
      ctx.fillStyle = '#b0453a';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle = '#7a2f26';
      ctx.fillRect(px,py,TILE,4);
      if(t==='e'){
        ctx.fillStyle = '#4a2a1a';
        ctx.fillRect(px+5,py+6,TILE-10,TILE-8);
        ctx.strokeStyle = '#2a1810';
        ctx.beginPath(); ctx.moveTo(px+TILE/2,py+6); ctx.lineTo(px+TILE/2,py+TILE-2); ctx.stroke();
      } else {
        ctx.fillStyle = '#6ea8d8';
        ctx.fillRect(px+TILE/2-6,py+6,12,10);
        ctx.strokeStyle = '#3d3220';
        ctx.strokeRect(px+TILE/2-6,py+6,12,10);
      }
    } else if(t==='2'){
      ctx.fillStyle = '#a8c973';
      ctx.fillRect(px,py,TILE,TILE);
      drawSprite(px, py, HOUSE_SPRITE, HOUSE_PALETTE, TILE/16, false);
    } else if(t==='4'){
      ctx.fillStyle = '#a8c973';
      ctx.fillRect(px,py,TILE,TILE);
      drawSprite(px, py, PERSON_SPRITE, NPC_PALETTE, TILE/16, false);
    } else if(t==='5'){
      ctx.fillStyle = '#a8c973';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle = '#c9955f';
      ctx.fillRect(px+4,py+8,TILE-8,TILE-14);
      ctx.fillStyle = '#7a5a35';
      ctx.beginPath(); ctx.moveTo(px+2,py+8); ctx.lineTo(px+TILE/2,py-2); ctx.lineTo(px+TILE-2,py+8); ctx.fill();
      ctx.fillStyle = '#fff8ec';
      ctx.font = '9px monospace';
      ctx.fillText('鶏', px+TILE/2-5, py+TILE/2+5);
    } else if(t==='1'){
      const ft = farmTile(wx,wy);
      ctx.fillStyle = ft.tilled ? '#6b3f26' : '#8b5a3c';
      ctx.fillRect(px,py,TILE,TILE);
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      for(let i=6;i<TILE;i+=8){ ctx.beginPath(); ctx.moveTo(px+i,py); ctx.lineTo(px+i,py+TILE); ctx.stroke(); }
      if(ft.planted && ft.growth>=1){
        const stage = ft.growth===1 ? SPROUT_SPRITE : ft.growth===2 ? GROWING_SPRITE : MATURE_SPRITE;
        const pal = ft.growth>=3 ? WHEAT_RIPE_PALETTE : WHEAT_PALETTE;
        drawSprite(px, py, stage, pal, TILE/16, false);
      }
      if(ft.watered){
        ctx.fillStyle = 'rgba(110,168,216,0.35)';
        ctx.fillRect(px,py,TILE,TILE);
      }
    }
  }

  function drawPlayer(camX, camY){
    const px = (state.px-camX)*TILE, py = (state.py-camY)*TILE;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(px+TILE/2, py+TILE-3, TILE*0.28, 4, 0, 0, Math.PI*2); ctx.fill();
    const scale = TILE/16;
    let sprite = PERSON_SPRITE, flip = false;
    if(state.dir==='up') sprite = BACK_SPRITE;
    else if(state.dir==='left'){ sprite = SIDE_SPRITE; flip = true; }
    else if(state.dir==='right'){ sprite = SIDE_SPRITE; flip = false; }
    drawSprite(px, py, sprite, PLAYER_PALETTE, scale, flip);
  }

  function draw(){
    const {camX, camY} = camera();
    const startX = Math.floor(camX), startY = Math.floor(camY);
    for(let wy=startY; wy<=startY+VIEW_ROWS; wy++){
      for(let wx=startX; wx<=startX+VIEW_COLS; wx++){
        const sx = (wx-camX)*TILE, sy = (wy-camY)*TILE;
        drawTile(wx, wy, sx/TILE, sy/TILE);
      }
    }
    drawPlayer(camX, camY);
  }

  load();
  updateHud();

  let lastT = null;
  function loop(t){
    if(lastT===null) lastT = t;
    const dt = Math.min((t-lastT)/1000, 0.05);
    lastT = t;
    let vx = stickVec.x, vy = stickVec.y;
    if(vx===0 && vy===0){
      if(keyVec.left) vx -= 1;
      if(keyVec.right) vx += 1;
      if(keyVec.up) vy -= 1;
      if(keyVec.down) vy += 1;
    }
    updatePosition(dt, vx, vy);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  setInterval(save, 2500);
})();
</script>
